
{% extends 'base.html' %}
{% block msg %} Login {% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 450px;">
  <div class="card shadow-lg">
    <div class="card-header bg-primary text-white text-center">
      <h3 class="mb-0">Login</h3>
    </div>
    <div class="card-body bg-light">
      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label for="username" class="form-label text-primary">Username</label>
          <input type="text" class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label text-primary">Password</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Log In</button>
      </form>
    </div>
    <div class="card-footer text-center">
      <p class="mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="text-decoration-none text-primary fw-bold">Register here</a>.</p>
    </div>
  </div>
</div>
{% endblock %}
