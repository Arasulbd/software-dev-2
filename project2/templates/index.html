{% extends 'base.html' %}
{% block title %}Home - My Shop{% endblock %}

{% block content %}

<main class="container mt-5">
  <h1 class="mb-4">Product List</h1>
  <section class="row justify-content-center">
      {% for product in products %}
      <div class="card col-lg-3 m-3 text-white" style="width: 400px;">
        <div class="position-relative zoom-effect">

            <img src="{{ product.image_url }}" class="card-img" alt="{{ product.name }}">
            <div class="card-img-overlay d-flex flex-column justify-content-between text-center" style="background-color: rgba(0, 0, 0, 0.4);">
              <div>
    
    
                    <h2 class="card-title text-danger"> {{ product.product_name }}</h2>
                    <p class="card-text">{{ product.product_desc }}</p>
                    <p class="card-text">${{ product.product_price }}</p>
              </div>
                  <form method="POST" action="{{ url_for('add_to_cart') }}">
                    <input type="hidden" name="product_id" value={{ product.id }}>
                    <button class="btn btn-light text-dark mt-2">Add to Cart</button>
                  </form>
                
            </div>
          </div>
        </div>

      {% endfor %}
    </section>
  </main>



{% endblock %}
